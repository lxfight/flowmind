services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: flowmind-postgres
    environment:
      POSTGRES_USER: flowmind
      POSTGRES_PASSWORD: flowmind_secret
      POSTGRES_DB: flowmind
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmind"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/lxfight/flowmind-backend:${FLOWMIND_VERSION:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${FLOWMIND_VERSION:-0.3.0}"
        GIT_SHA: "${GIT_SHA:-development}"
        BUILD_TIME: "${BUILD_TIME:-}"
        DEBIAN_MIRROR: "${DEBIAN_MIRROR:-http://deb.debian.org/debian}"
        DEBIAN_SECURITY_MIRROR: "${DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}"
        PYPI_INDEX_URL: "${PYPI_INDEX_URL:-https://pypi.org/simple}"
    container_name: flowmind-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://flowmind:flowmind_secret@postgres:5432/flowmind
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      FLOWMIND_ADMIN_USERNAME: "${FLOWMIND_ADMIN_USERNAME:-}"
      FLOWMIND_ADMIN_PASSWORD: "${FLOWMIND_ADMIN_PASSWORD:-}"
      DEBUG: "${DEBUG:-false}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_REPORT_TIMEOUT: "${LLM_REPORT_TIMEOUT:-180}"
      LLM_REPORT_MAX_RETRIES: "${LLM_REPORT_MAX_RETRIES:-2}"
      LLM_REPORT_RETRY_BASE_DELAY: "${LLM_REPORT_RETRY_BASE_DELAY:-1}"
      LLM_EMBEDDING_MODEL: "${LLM_EMBEDDING_MODEL:-text-embedding-3-small}"
      LLM_EMBEDDING_DIM: "${LLM_EMBEDDING_DIM:-1536}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
      KNOWLEDGE_MAX_BYTES: "${KNOWLEDGE_MAX_BYTES:-26214400}"
      RELEASE_REPOSITORY: "${RELEASE_REPOSITORY:-lxfight/flowmind}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      UPDATER_URL: "http://updater:8090"
      UPDATER_TOKEN: "${FLOWMIND_UPDATER_TOKEN:-flowmind-local-updater-change-me}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: ghcr.io/lxfight/flowmind-frontend:${FLOWMIND_VERSION:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${FLOWMIND_VERSION:-0.3.0}"
        GIT_SHA: "${GIT_SHA:-development}"
        BUILD_TIME: "${BUILD_TIME:-}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    container_name: flowmind-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  updater:
    image: ghcr.io/lxfight/flowmind-updater:${FLOWMIND_VERSION:-local}
    build:
      context: ./updater
      dockerfile: Dockerfile
      args:
        APP_VERSION: "${FLOWMIND_VERSION:-0.3.0}"
        GIT_SHA: "${GIT_SHA:-development}"
        BUILD_TIME: "${BUILD_TIME:-}"
        ALPINE_MIRROR: "${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}"
    container_name: flowmind-updater
    environment:
      FLOWMIND_UPDATER_TOKEN: "${FLOWMIND_UPDATER_TOKEN:-flowmind-local-updater-change-me}"
      FLOWMIND_PROJECT_DIR: "${PWD}"
      FLOWMIND_UPDATE_STATE_DIR: /state
      COMPOSE_PROJECT_NAME: flowmind
      FLOWMIND_RELEASE_REPOSITORY: "${RELEASE_REPOSITORY:-lxfight/flowmind}"
      FLOWMIND_GITHUB_ACCELERATORS: "${FLOWMIND_GITHUB_ACCELERATORS:-}"
      FLOWMIND_GIT_FETCH_TIMEOUT: "${FLOWMIND_GIT_FETCH_TIMEOUT:-45}"
      FLOWMIND_UPDATE_MIN_FREE_BYTES: "${FLOWMIND_UPDATE_MIN_FREE_BYTES:-1073741824}"
    working_dir: "${PWD}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${PWD}:${PWD}"
      - updater_state:/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  updater_state:
